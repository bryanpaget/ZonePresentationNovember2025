name: Build Marp Slides PDFs

on:
  push:
    branches: [fall-2025]
  pull_request:
    branches: [fall-2025]

permissions:
  contents: write  # Required to create tags and releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Needed to list tags

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Create combined markdown files
        run: |
          mkdir -p temp
          cat config/header.md content/slides-en.md > temp/slides-en-combined.md

      - name: Copy images to temp directory
        run: |
          cp -r img temp/

      - name: Build PDF
        run: |
          marp temp/slides-en-combined.md --pdf --output the-zone-demo-fall-2025.pdf --allow-local-files

      - name: Verify PDF exists
        run: |
          if [ -f the-zone-demo-fall-2025.pdf ]; then
            echo "PDF built successfully"
            ls -la *.pdf
          else
            echo "PDF not built!"
            exit 1
          fi

      - name: Upload PDF artifact (always)
        uses: actions/upload-artifact@v4
        with:
          name: zone-demo-pdf
          path: the-zone-demo-fall-2025.pdf
          retention-days: 30

      # ONLY on push to fall-2025 (not on pull_request)
      - name: Auto-create tag and release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fall-2025'
        run: |
          # Configure Git
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Create a unique, sortable tag name
          DATE=$(date -u +%Y.%m.%d)
          TAG="auto/v${DATE}-run${{ github.run_number }}"
          
          echo "Creating tag: $TAG"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Create GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/fall-2025'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "auto/v$(date -u +%Y.%m.%d)-run${{ github.run_number }}"
          name: "Auto Release – $(date -u +%Y-%m-%d) (Run ${{ github.run_number }})"
          body: |
            Automatically generated release for The Zone Fall 2025 demo.
            
            - Built from commit ${{ github.sha }}
            - Triggered by push to \`fall-2025\`
            - Run #${{ github.run_number }}
          files: the-zone-demo-fall-2025.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
