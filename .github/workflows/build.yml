name: Build Marp Slides PDFs
on:
  push:
    branches: [fall-2025]
  pull_request:
    branches: [fall-2025]
permissions:
  contents: read
  id-token: write  # Required to upload to GitHub releases
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          
      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli
          
      - name: Create combined markdown files
        run: |
          # Create temp directory
          mkdir -p temp
          # Combine header + content for English
          cat config/header.md content/slides-en.md > temp/slides-en-combined.md
          
      - name: Copy images to temp directory
        run: |
          # Copy img directory to temp for PDF generation
          cp -r img temp/
          
      - name: Build PDF
        run: |
          marp temp/slides-en-combined.md --pdf --output the-zone-demo-fall-2025.pdf --allow-local-files
          
      - name: Verify PDF exists
        run: |
          if [ -f the-zone-demo-fall-2025.pdf ]; then
            echo "PDF built successfully"
            ls -la *.pdf
          else
            echo "PDF not built!"
            exit 1
          fi
          
      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: zone-demo-pdf
          path: the-zone-demo-fall-2025.pdf
          retention-days: 30

      - name: Create Git tag
        run: |
          TAG_NAME="v$(date +'%Y%m%d%H%M%S')"  # Use current timestamp as tag
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create GitHub Release and upload PDF
        uses: softprops/action-gh-release@v1
        with:
          files: the-zone-demo-fall-2025.pdf
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
