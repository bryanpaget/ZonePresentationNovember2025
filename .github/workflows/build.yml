name: Build Marp Slides PDFs

on:
  # Run build on every push to fall-2025 (for validation & artifact)
  push:
    branches: [fall-2025]
    tags: []  # explicitly exclude tags here if you want separate logic
  pull_request:
    branches: [fall-2025]
  # ALSO run on tag pushes to create releases
  push:
    tags: ["v*"]  # only tags like v1.0, v2025.11, etc.

permissions:
  contents: write  # Needed to create releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Create combined markdown files
        run: |
          mkdir -p temp
          cat config/header.md content/slides-en.md > temp/slides-en-combined.md

      - name: Copy images to temp directory
        run: |
          cp -r img temp/

      - name: Build PDF
        run: |
          marp temp/slides-en-combined.md --pdf --output the-zone-demo-fall-2025.pdf --allow-local-files

      - name: Verify PDF exists
        run: |
          if [ -f the-zone-demo-fall-2025.pdf ]; then
            echo "PDF built successfully"
            ls -la *.pdf
          else
            echo "PDF not built!"
            exit 1
          fi

      - name: Upload PDF artifact
        uses: actions/upload-artifact@v4
        with:
          name: zone-demo-pdf
          path: the-zone-demo-fall-2025.pdf
          retention-days: 30

      # Only create a release if this run was triggered by a tag
      - name: Create GitHub Release and upload PDF
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: the-zone-demo-fall-2025.pdf
          body: |
            # Zone Presentation
            
            This release contains the presentation materials for the Zone demo.
            
            ## What's Included
            - `the-zone-demo-fall-2025.pdf`: English version of the presentation
            
            ## Built with
            - Marp CLI
            - GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
