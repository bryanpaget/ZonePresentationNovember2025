apiVersion: batch/v1
kind: CronJob
metadata:
  name: real-time-analytics
  namespace: your-namespace
spec:
  schedule: "*/2 * * * *"  # Every 2 minutes for demo
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: analytics-processor
            image: zone/python:latest
            command: ["python", "/app/realtime_analytics.py"]
            env:
            - name: ENVIRONMENT
              value: "demo"
            resources:
              requests:
                memory: "2Gi"
                cpu: "1"
              limits:
                memory: "4Gi"
                cpu: "2"
            volumeMounts:
            - mountPath: /shared-data
              name: shared-volume
          volumes:
          - name: shared-volume
            persistentVolumeClaim:
              claimName: analytics-pvc
          restartPolicy: OnFailure
