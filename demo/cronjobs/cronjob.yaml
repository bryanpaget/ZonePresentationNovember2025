apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-processing-pipeline
  namespace: your-namespace
spec:
  schedule: "0 6 * * 1-5"  # 6 AM Monday-Friday
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: data-processor
            image: zone/python:latest
            command: ["python", "/app/process_data.py"]
            env:
            - name: ENVIRONMENT
              value: "production"
            resources:
              requests:
                memory: "2Gi"
                cpu: "1"
              limits:
                memory: "4Gi"
                cpu: "2"
          restartPolicy: OnFailure
